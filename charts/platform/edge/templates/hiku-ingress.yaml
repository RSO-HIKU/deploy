apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.edge.ingress.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ join "," .Values.edge.ingress.entrypoints | quote }}
    {{- if .Values.edge.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," .Values.edge.ingress.middlewares | quote }}
    {{- end }}
    {{- if and .Values.edge.ingress.tls.enabled .Values.edge.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.edge.ingress.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if and .Values.edge.ingress.tls.enabled .Values.edge.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.edge.ingress.host | quote }}
      secretName: {{ .Values.edge.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - {{- if .Values.edge.ingress.host }}
      host: {{ .Values.edge.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.edge.ingress.routes }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
