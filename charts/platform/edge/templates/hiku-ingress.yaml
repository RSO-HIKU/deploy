apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiku-ingress
  namespace: dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dev-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8083
          - path: /api/activities
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: 8085
          - path: /api/weather
            pathType: Prefix
            backend:
              service:
                name: weather-service
                port:
                  number: 8086
          - path: /api/badges
            pathType: Prefix
            backend:
              service:
                name: badge-service
                port:
                  number: 8087
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8088
          - path: /api/scoreboards-challenges
            pathType: Prefix
            backend:
              service:
                name: scoreboards-challenges-service
                port:
                  number: 8089
          - path: /api/feed
            pathType: Prefix
            backend:
              service:
                name: social-feed-service
                port:
                  number: 8091
          - path: /api/trail-import
            pathType: Prefix
            backend:
              service:
                name: trail-import-service
                port:
                  number: 8084
          - path: /api/peaks-hikes
            pathType: Prefix
            backend:
              service:
                name: peaks-hikes-service
                port:
                  number: 8082