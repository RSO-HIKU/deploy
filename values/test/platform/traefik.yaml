traefik:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-pip-name: "pip-traefik-hiku-test-plc"
      service.beta.kubernetes.io/azure-load-balancer-resource-group: "MC_rg-hiku-test-plc_aks-hiku-test-plc_polandcentral"
    spec:
      loadBalancerIP: "74.248.154.93"  # Set from Terraform output: traefik_public_ip

  containerSecurityContext:
    capabilities:
      add:
        - NET_BIND_SERVICE

  additionalArguments:
    - "--api.insecure=false"
    - "--log.level=INFO"

  ingressRoute:
    dashboard:
      enabled: false

  ports:
    web:
      port: 8000
      exposedPort: 80
    websecure:
      port: 8443
      exposedPort: 443

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"