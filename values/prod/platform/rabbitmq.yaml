replicaCount: 1

image:
  repository: rabbitmq
  tag: "3-management-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  amqpPort: 5672
  managementPort: 15672

managementNodePort:
  enabled: false

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

azure:
  enabled: true
  keyVaultName: "kv-hiku-prod-plc"
  tenantId: "a6cc90df-f580-49dc-903f-87af5a75338e"
  kvCsiClientId: ""