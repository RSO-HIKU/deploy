replicaCount: 1

environment: prod

image:
  repository: acrhikuprodplc.azurecr.io/activity-service
  tag: sha-PLACEHOLDER
  pullPolicy: IfNotPresent

database:
  enabled: false
  schema: activity_service

azure:
  enabled: true
  tenantId: "a6cc90df-f580-49dc-903f-87af5a75338e"
  keyVaultName: "kv-hiku-prod-plc"
  kvCsiClientId: "" # From terraform output aks_kv_csi_client_id
  database: hikudb
  port: "5432"
  sslmode: require

gitops:
  enabled: true

dbPool:
  poolMinSize: 1
  poolMaxSize: 3

service:
  clusterIP:
    port: 8085
    address: "0.0.0.0"
  nodePort:
    enabled: false

flyway:
  image:
    repository: acrhikuprodplc.azurecr.io/activity-service-migrator
    tag: sha-PLACEHOLDER
    pullPolicy: IfNotPresent

jwtAuth:
  issuer: "https://traefik-hiku-prod.polandcentral.cloudapp.azure.com/auth/realms/hiku-prod"
  jwksUri: "http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/hiku-prod/protocol/openid-connect/certs"

health:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3