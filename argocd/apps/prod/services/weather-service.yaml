apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: services
  sources:
    # 1) Helm chart from the service repo
    - repoURL: https://github.com/RSO-HIKU/weather-service.git
      targetRevision: prod
      path: helm
      helm:
        valueFiles:
          # Pull values from the deploy repo (ref 'values' below)
          - $values/values/prod/services/weather-service.yaml

    # 2) Values repo (deploy repo)
    - repoURL: https://github.com/RSO-HIKU/deploy.git
      targetRevision: prod
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: services

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
