apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/RSO-HIKU/deploy.git
    targetRevision: test
    path: charts/platform/rabbitmq
    helm:
      valueFiles:
        - ../../../values/test/platform/rabbitmq.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
