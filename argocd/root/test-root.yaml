apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-test
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/<org>/<deploy-repo>.git
    targetRevision: main
    path: argocd/apps/test
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
